name: frontend
description: "SafeHer-AI — Zero-touch autonomous safety guardian for women."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  flutter_svg: ^2.0.17

  # State Management
  provider: ^6.1.5

  # Navigation
  go_router: ^16.0.0

  # Networking
  http: ^1.5.0
  dio: ^5.8.0
  web_socket_channel: ^3.0.3

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # Location & Maps
  geolocator: ^14.0.0
  google_maps_flutter: ^2.14.0

  # Sensors & AI
  sensors_plus: ^7.0.1
  tflite_flutter: ^0.11.0

  # Audio & Camera
  record: ^6.2.1
  camera: ^0.11.1

  # SMS / Telephony handled via SMS URI / platform channel fallbacks

  # Notifications
  flutter_local_notifications: ^19.0.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Permissions
  permission_handler: ^12.0.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
